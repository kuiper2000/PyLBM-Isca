name: deploy-book

# Build the PyLBM-Isca Users' Guide (docs/book, a Jupyter Book 2 / MyST
# project) and publish it to GitHub Pages at
# https://kuiper2000.github.io/PyLBM-Isca/
#
# The notebooks are committed with their outputs embedded, so the build only
# renders them (no execution, no GPU, no input data needed).

on:
  push:
    branches: [main]
    paths:
      - "docs/book/**"
      - ".github/workflows/deploy-book.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Jupyter Book
        run: pip install "jupyter-book>=2"
      - name: Build HTML
        working-directory: docs/book
        env:
          BASE_URL: /PyLBM-Isca
        run: jupyter-book build --html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
